[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# defaults plus import order, modern syntax, bugbear, async pitfalls and bandit-style security rules
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "S", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# tests use assert, a fake token, subprocess to call git/ssh-keygen, and temp paths on purpose
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "ASYNC240"]
